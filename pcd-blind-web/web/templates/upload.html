{{define "files-body"}}
<div id="tab-files">
    <h2 style="margin-bottom:16px">📁 文件管理</h2>

    <div class="upload-area" id="upload-area">
        <form hx-encoding="multipart/form-data" hx-post="/upload" hx-target="#upload-area" hx-swap="outerHTML">
            <div style="font-size:40px;margin-bottom:12px">📤</div>
            <div style="margin-bottom:12px;color:var(--muted)">拖放或点击上传 PCD 点云文件</div>
            <input type="file" name="pcd_file" accept=".pcd" style="color:var(--text);margin-bottom:12px">
            <button type="submit" class="btn btn-primary">上传</button>
        </form>
        {{if .Error}}<div class="msg-err">{{.Error}}</div>{{end}}
        {{if .OK}}<div class="msg-ok">{{.OK}}</div>{{end}}
    </div>

    <div hx-get="/source-list" hx-trigger="load" hx-swap="innerHTML" style="margin-top:20px">
        <div class="file-list"></div>
    </div>
</div>
{{end}}

{{define "source-list"}}
{{if .}}
<div class="file-list">
    {{range .}}
    <div class="file-chip">
        <span>📄 {{.}}</span>
        <span class="del" hx-delete="/source/{{.}}" hx-target="closest .file-list" hx-swap="outerHTML">×</span>
    </div>
    {{end}}
</div>
{{else}}
<div class="empty"><div class="icon">📭</div>暂无文件，上传一个 PCD 开始吧</div>
{{end}}
{{end}}
